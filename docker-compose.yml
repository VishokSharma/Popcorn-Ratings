version: '3.8'

services:

  # --------------------------------------------
  # PostgreSQL Database Service
  # --------------------------------------------
  database:
    container_name: popcorn_postgres
    image: postgres:15-alpine
    restart: unless-stopped
    
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: popcorn_ratings
      PGDATA: /var/lib/postgresql/data
    
    ports:
      - "5432:5432"
    
    volumes:
      - postgres_data:/var/lib/postgresql/data
    
    networks:
      - popcorn_network
    
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --------------------------------------------
  # pgAdmin - Database Management UI
  # --------------------------------------------
  pgadmin:
    container_name: popcorn_pgadmin
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    
    environment:
      # Login credentials for pgAdmin web interface
      PGADMIN_DEFAULT_EMAIL: admin@popcornratings.com
      PGADMIN_DEFAULT_PASSWORD: admin
      
      # Disable additional password prompts
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
      PGADMIN_CONFIG_SERVER_MODE: 'True'
    
    ports:
      # Access pgAdmin at http://localhost:5050
      - "5050:80"
    
    volumes:
      # Persist pgAdmin configuration and saved servers
      - pgadmin_data:/var/lib/pgadmin
    
    networks:
      - popcorn_network
    
    # Wait for database to be ready before starting pgAdmin
    depends_on:
      database:
        condition: service_healthy

volumes:
  # PostgreSQL data volume
  postgres_data:
    driver: local
  
  # pgAdmin data volume (saves your server connections)
  pgadmin_data:
    driver: local

networks:
  # Shared network for all containers
  popcorn_network:
    driver: bridge